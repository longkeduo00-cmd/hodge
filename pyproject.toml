[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hodge-vnext"
version = "0.2.0"
description = "Independent exclusive-q Hodge comparison, real48/synthetic experiments, and zero modes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "networkx>=3.2",
  "pandas>=2.1", "matplotlib>=3.8", "scikit-learn>=1.3"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hodge_vnext*", "validation*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
